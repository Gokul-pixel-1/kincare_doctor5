name: kincare_doctor5
description: "Medscope AI – Clinical decision support app for doctors."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Assets (required even if icon tool uses direct path)
  assets:
    - assets/icon/
    # (future-ready: you can add images/, fonts/, etc.)

# App launcher icon configuration
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/medscope_ai_icon.png"